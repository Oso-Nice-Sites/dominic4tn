# Manual production deploy of the website to Cloudflare Workers.
#
# NOT YET EXERCISED: it needs the campaign's Cloudflare account and the secrets
# below, so it has not run. It is manual-only (workflow_dispatch) on purpose —
# once you trust it, you can add a `push: branches: [main]` trigger, ideally
# behind the required reviewers on the "production" environment.
#
# One-time setup — see README.md ("CI/CD → Cloudflare deploy"):
#   Secrets   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables SANITY_PROJECT_ID, SANITY_DATASET   (baked into the build)
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending D1 database migrations before deploying"
        type: boolean
        default: false

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Apply D1 migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build and deploy
        run: npm run deploy
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET }}
